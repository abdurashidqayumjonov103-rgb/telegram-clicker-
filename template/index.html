<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gold Clicker WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header / Balance -->
        <header class="header">
            <div class="user-badge" id="username">User</div>
            <div class="balance-container">
                <span class="coin-icon">🪙</span>
                <span id="balance">0</span>
            </div>
        </header>

        <!-- Main Click Area -->
        <main class="game-area">
            <button id="coin-btn" class="coin-button">
                🪙
            </button>
        </main>

        <!-- Dynamic Navigation Tabs -->
        <nav class="nav-bar">
            <button class="nav-item active" onclick="showTab('main')">🎮 O'yin</button>
            <button class="nav-item" onclick="showTab('upgrades')">⚡ Boost</button>
            <button class="nav-item" onclick="showTab('leaderboard')">🏆 Top</button>
            <button class="nav-item" onclick="showTab('profile')">👤 Profil</button>
        </nav>

        <!-- Tab contents -->
        <section id="upgrades-tab" class="tab-content hidden">
            <h3>Upgrade Clicker</h3>
            <p>Level: <span id="click-level">1</span></p>
            <button id="upgrade-btn" class="action-btn">Kengaytirish (<span id="upgrade-cost">100</span> coin)</button>
        </section>

        <section id="leaderboard-tab" class="tab-content hidden">
            <h3>TOP 10 O'yinchilar</h3>
            <ol id="leaderboard-list"></ol>
        </section>

        <section id="profile-tab" class="tab-content hidden">
            <h3>Profil va Referral</h3>
            <p>Telegram ID: <span id="user-id">-</span></p>
            <p>Referralingiz: <span id="ref-count">0</span> ta</p>
            <button id="ref-btn" class="action-btn">Referral Havoladan Nusxa Olish</button>
        </section>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
